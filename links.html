<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XOFQuiet — Links</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- BACKGROUND BLOBS -->
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <!-- FLOATING SHAPES -->
  <div class="float-shape fs1"></div>
  <div class="float-shape fs2"></div>
  <div class="float-shape fs3"></div>

  <!-- DARK MODE TOGGLE -->
  <button class="dark-toggle" id="darkToggle">☾</button>

  <!-- PAGE CONTENT -->
  <section class="fade section-contact links-section">

    <img src="images/avatar.jpg" alt="Profile Picture" class="links-avatar">

    <h2 class="section-title shimmer">@XOFQuiet</h2>

    <p class="contact-sub links-sub">
      Connect with me across all my platforms.
    </p>

    <!-- LINKS LIST -->
    <div class="links-list">

      <a href="https://github.com/" target="_blank" class="glass lift magnetic link-card">
        <img src="images/github.svg" alt="GitHub" class="link-icon">
        GitHub
      </a>

      <a href="https://discord.com/" target="_blank" class="glass lift magnetic link-card">
        <img src="images/discord.svg" alt="Discord" class="link-icon">
        Discord
      </a>

      <a href="https://instagram.com/" target="_blank" class="glass lift magnetic link-card">
        <img src="images/instagram.svg" alt="Instagram" class="link-icon">
        Instagram
      </a>

      <a href="https://threads.net/" target="_blank" class="glass lift magnetic link-card">
        <img src="images/threads.svg" alt="Threads" class="link-icon">
        Threads
      </a>

      <a href="https://reddit.com/" target="_blank" class="glass lift magnetic link-card">
        <img src="images/reddit.svg" alt="Reddit" class="link-icon">
        Reddit
      </a>

      <a href="https://bsky.app/" target="_blank" class="glass lift magnetic link-card">
        <img src="images/bluesky.svg" alt="Bluesky" class="link-icon">
        Bluesky
      </a>

      <a href="https://x.com/" target="_blank" class="glass lift magnetic link-card">
        <img src="images/x.svg" alt="X" class="link-icon">
        X
      </a>

      <a href="https://steamcommunity.com/" target="_blank" class="glass lift magnetic link-card">
        <img src="images/steam.svg" alt="Steam" class="link-icon">
        Steam
      </a>

      <a href="https://linktr.ee/" target="_blank" class="glass lift magnetic link-card">
        <img src="images/linktree.svg" alt="Linktree" class="link-icon">
        Linktree
      </a>

    </div>

    <!-- Back Button -->
    <div class="links-back">
      <button class="cta magnetic ripple shimmer" onclick="window.location.href='index.html'">
        ← Back to Portfolio
      </button>
    </div>

  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2026 XOFQuiet | All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
